[package]
name = "ssh-tunnel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Turnkey remote SSH access via Cloudflare Tunnel"
license = "MIT"
repository = "https://github.com/Enky-yy/ssh-tunnel"
homepage = "https://github.com/Enky-yy/ssh-tunnel"
readme = "README.md"
keywords = ["ssh", "cloudflare", "tunnel", "remote-access", "cli"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
qrcode = "0.14"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
